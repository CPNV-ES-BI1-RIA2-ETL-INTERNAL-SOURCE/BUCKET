services:
  bucket:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: "bucket"
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_BUCKET: ${AWS_BUCKET}
      PROVIDER: ${PROVIDER}